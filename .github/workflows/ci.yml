name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Demo server answers from the recorded runs, with no API key
        run: |
          pnpm demo &
          for i in $(seq 1 30); do curl -sf http://localhost:4321/api/propose/latest > /dev/null && break; sleep 1; done
          curl -sf http://localhost:4321/api/propose/latest > /dev/null
          curl -sf "http://localhost:4321/api/proposal?id=74a7daf3" > /dev/null
          curl -sf http://localhost:4321/api/chat/latest > /dev/null

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
